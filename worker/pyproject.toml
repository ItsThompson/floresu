[project]
name = "floresu-worker"
version = "0.0.0"
description = "Floresu arq worker: incremental embedding jobs."
requires-python = ">=3.12"
# Upper-major caps bound an unpinned resolve to the majors this ticket validated
# against; the committed uv.lock is the source of truth (`uv sync --frozen`). The
# worker shares NO code with the backend: it is a thin arq worker that reads items
# and writes vectors back over the internal API (network hop), and re-declares the
# few wire constants it needs (kept honest by the cross-package contract tests).
dependencies = [
    "arq>=0.26.0,<1",
    "httpx>=0.27.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floresu_worker"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Real-Redis integration test for the arq enqueue/dequeue round trip (skips
    # without Docker), mirroring the backend/mcp testcontainers usage.
    "testcontainers[redis]>=4.8,<5",
]

[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# testcontainers ships no type stubs; only its Redis container helper is used.
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# arq ships no py.typed marker; the worker uses its WorkerSettings + create_pool.
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: exercises a real Redis via testcontainers (skipped without Docker)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
