# =============================================================================
# Cloudflare Tunnel ingress for Floresu.
#
# This is the COMMITTED TEMPLATE. CI renders it with envsubst (substituting only
# the CF_* vars below, sourced from the committed .env.prod) into the
# FLORESU_CLOUDFLARED_INGRESS env var, and cloudflared (docker-compose.tunnel.yml)
# receives it as an environment-sourced Compose config mounted read-only at
# /etc/cloudflared/config.yml. No rendered file is written to the box; the
# named-tunnel credentials are delivered the same way (a GitHub secret).
#
# One named tunnel, three routed hosts, outbound-only (zero inbound ports).
# TLS terminates at the Cloudflare edge; origin traffic inside Docker is
# plaintext http:// on app-net.
#
# HOST-SPLIT: floresu.app (SPA) and api.floresu.app (backend :8000) are distinct
# origins. The SPA calls the API cross-origin (baked VITE_API_BASE_URL); the SPA
# container's nginx serves index.html for any unmatched path, so deep links and
# the /authorize OAuth-consent landing resolve client-side.
#
# Rule order matters: cloudflared evaluates top-to-bottom, first match wins.
# =============================================================================
tunnel: ${CF_TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # 1. SPA (floresu.app) -> nginx static frontend (history-API fallback inside).
  - hostname: ${CF_APP_HOSTNAME}
    service: http://frontend:80

  # 2. External API (api.floresu.app) -> backend external app (:8000). The
  #    internal app (:8001) is NEVER routed here (it stays non-tunnel-routed on
  #    app-net, token-gated).
  #    The observability/health surface (/metrics, /healthz, /readyz) is scraped
  #    and probed in-network and MUST NOT be tunnel-reachable, so it is blocked
  #    here at ingress BEFORE the catch-through to the backend (mirrors the mcp
  #    host's allow-list below). /metrics on the AS host would otherwise leak
  #    internal Prometheus data (oauth_tokens_issued_total,
  #    service_method_failures_total, 5xx rates, route templates); Prometheus
  #    still scrapes backend:8000/:8001 internally.
  - hostname: ${CF_API_HOSTNAME}
    path: '^/(metrics|healthz|readyz)/?$'
    service: http_status:404
  - hostname: ${CF_API_HOSTNAME}
    service: http://backend:8000

  # 3. MCP (mcp.floresu.app): PUBLICLY expose ONLY the PRM discovery document
  #    (/.well-known/oauth-protected-resource) and the /mcp transport. The MCP
  #    server's /metrics, /healthz and /readyz are scraped in-network and MUST
  #    NOT be reachable through the tunnel. Any other path on this hostname falls
  #    through to the per-host 404 rule below.
  - hostname: ${CF_MCP_HOSTNAME}
    path: '^/(mcp(/.*)?|\.well-known/oauth-protected-resource)$'
    service: http://mcp:9000
  - hostname: ${CF_MCP_HOSTNAME}
    service: http_status:404

  # 4. Catch-all: everything else is refused at the edge.
  - service: http_status:404
