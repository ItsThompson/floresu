[project]
name = "floresu-mcp"
version = "0.0.0"
description = "Floresu MCP server: OAuth 2.1 resource server (PRM + bearer validation) and a thin client of the backend internal API (:8001)."
requires-python = ">=3.12"
# Upper-major caps mirror the backend's runtime stack (the committed uv.lock is
# the source of truth; `uv sync --frozen` enforces it). structlog (calver) stays
# uncapped so patches are never blocked. The MCP server shares NO code with the
# backend: it re-declares the wire types + header/scope constants it needs,
# kept honest by the contract tests in `contract/tests/`.
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0,<1",
    "prometheus-fastapi-instrumentator>=7.0.0,<9",
    "httpx>=0.27.0,<1",
    "joserfc>=1.0.0,<2",
    "redis>=5.0.0,<7",
    "mcp>=1.27,<2",
]

[project.scripts]
floresu-mcp = "floresu_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floresu_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Real-Redis integration test for the rate limiter (skips without Docker),
    # mirroring the backend's testcontainers usage.
    "testcontainers[redis]>=4.8,<5",
]

[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
python_version = "3.12"
strict = true
# Type-check the package plus the test suite so the hand-written token/harness
# fakes are held to the shapes they stand in for (a diverged fake fails
# ``mypy --strict``). Tests are packaged (tests/__init__.py), so their support
# modules resolve as ``tests.*``, mirroring the backend layout.
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# testcontainers ships no type stubs; only its Redis container helper is used.
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The 80% floor is enforced here now that the RS foundation ships real tests,
# matching the backend gate.
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: exercises a real Redis via testcontainers (skipped without Docker)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
