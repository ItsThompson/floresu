# Local development services for Floresu.
#
# Postgres is a pgvector-enabled image so `CREATE EXTENSION vector` works; the
# vector column and index in later slices depend on it. Redis backs the arq
# queue, SSE pub/sub, and rate-limit counters.
#
# This file is the local dev stack: both services publish a host port for
# direct access from the host. The production topology (expose-only, no host
# ports, three network tiers, Cloudflare Tunnel) is a separate deploy overlay.

name: floresu

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: floresu
      POSTGRES_PASSWORD: floresu
      POSTGRES_DB: floresu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floresu -d floresu"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data-net

volumes:
  postgres-data:
  redis-data:

networks:
  data-net:
