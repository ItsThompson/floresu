# Floresu SPA served by nginx: static assets plus a history-API fallback so
# client-side routes resolve, fronted by the Cloudflare tunnel (floresu.com). The
# SPA calls the API cross-origin (api.floresu.com); nginx serves static files
# only, no reverse proxy.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets are immutable: cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA entry: any unmatched path serves index.html so react-router's browser
    # history routes (e.g. /authorize, deep links) resolve on reloads. The HTML
    # entry itself is never cached so new deploys take effect immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Liveness for the compose health gate, probed in-container. The tunnel edge
    # allow-list also 404s /healthz on the app host, so it is not publicly served.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
