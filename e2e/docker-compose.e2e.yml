# =============================================================================
# Floresu E2E infrastructure overlay.
#
# A self-contained stack for the Playwright full-stack suite: Postgres
# (pgvector), Redis, and an S3-compatible object store (Adobe S3Mock, standing in
# for Cloudflare R2). Its own project name (floresu-e2e) and non-default host
# ports keep it isolated from any local dev stack (or host-installed
# Postgres/Redis) so the two can run side by side.
#
# The app processes (both ASGI apps, the frontend, and the fake embedding
# provider) are NOT containerized here: Playwright's `webServer` launches them as
# host processes so the object-store presigned download URL (minted for
# http://localhost:9002) is reachable by the browser AND by the backend that
# mints it. Embedding is faked by a local HTTP provider (see fakes/), and the
# object store is a local emulator, so no run ever calls OpenAI or real R2.
# =============================================================================
name: floresu-e2e

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: floresu
      POSTGRES_PASSWORD: floresu
      POSTGRES_DB: floresu
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floresu -d floresu"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  objectstore:
    # Adobe S3Mock stands in for Cloudflare R2. MinIO no longer publishes an
    # image on Docker Hub or Quay, so this is the maintained alternative. It
    # covers the only surface the suite uses: create_bucket, put_object, and a
    # presigned GET the browser can fetch. Credentials are accepted, not checked.
    image: adobe/s3mock:5.2.3
    ports:
      - "9002:9090"
    healthcheck:
      # No curl in this image; wget exits non-zero until the API answers.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 3s
      timeout: 5s
      retries: 20
