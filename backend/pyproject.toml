[project]
name = "floresu-backend"
version = "0.0.0"
description = "Floresu shared application core and the two in-process HTTP adapters."
requires-python = ">=3.12"
# Upper-major caps bound an unpinned resolve to the majors this ticket validated
# against; the committed uv.lock is the source of truth (`uv sync --frozen`).
# structlog is left uncapped so security patches are never blocked.
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0,<1",
    "prometheus-fastapi-instrumentator>=7.0.0,<9",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30.0,<1",
    "alembic>=1.14.0,<2",
    "pyjwt>=2.9.0,<3",
    "bcrypt>=4.2.0,<5",
    "email-validator>=2.2.0,<3",
    # Agent OAuth 2.1 AS crypto: joserfc mints/verifies RS256 access tokens and
    # shapes the published JWKS (typed, ships py.typed; pulls cryptography). The
    # HS256 human-session path stays on pyjwt. python-multipart backs the
    # form-encoded /token + /revoke endpoints (FastAPI Form parsing).
    "joserfc>=1.0.0,<2",
    "python-multipart>=0.0.9,<1",
    # Async Redis client for the live activity feed: pub/sub fan-out per user and
    # the bounded replay buffer the SSE endpoint reconnect-replays from. redis-py
    # ships py.typed and an asyncio interface (redis.asyncio).
    "redis>=5.0.0,<7",
    # Semantic-search vector storage: pgvector's SQLAlchemy ``Vector`` column type
    # backs the ``embeddings`` table (dimension pinned to the P0 provider). The
    # Postgres image bundles the extension; this is the typed ORM binding.
    "pgvector>=0.3.0,<1",
    # arq is the Redis-backed job queue: the external app enqueues one embed job
    # per content-changing write onto the queue the worker drains.
    "arq>=0.26.0,<1",
    # httpx backs the OpenAI embedding provider on the synchronous fast-path (an
    # injected AsyncClient, faked in tests so no live OpenAI call is made).
    "httpx>=0.27.0,<1",
]

[project.scripts]
floresu-api = "floresu.api.main:main"
floresu-api-internal = "floresu.api_internal.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floresu"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.8,<5",
]

[tool.ruff]
extend = "../ruff.toml"
# Kept local so first-party import detection resolves against this package's own
# src/tests, not the repo root.
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# The error hierarchy is named by HTTP semantics (NotFound, Conflict, ...) so
# `raise NotFound(...)` reads naturally and matches the RFC 9457 problem
# contract; the N818 "Error"-suffix rule would only hurt readability here.
"src/floresu/core/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
# Type-check the package, the Alembic env module, and the test suite. The tests
# are packaged (tests/__init__.py), so their support modules resolve and any
# diverged fake or fixture signature fails mypy --strict.
files = ["src/floresu", "alembic/env.py", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# testcontainers ships no type stubs; only its Postgres container helper is used.
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The 80% floor is enforced here now that the core kit ships real tests. The
# integration tests skip when Docker is unavailable; the unit suite alone stays
# above the floor so a Docker-less checkout still passes the gate.
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: exercises a real Postgres via testcontainers (skipped without Docker)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
