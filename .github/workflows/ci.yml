name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, worker, mcp]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy --strict)
        run: uv run mypy --strict

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Test (vitest, coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  codegen-drift:
    name: codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Regenerate the OpenAPI document from the live FastAPI app and the TS
      # client from it, then fail if the committed client is stale. Mirrors
      # `just codegen`.
      - name: Regenerate the typed client
        run: |
          cd backend
          LOG_LEVEL=critical uv run python -c "import json; from floresu.api.main import app; print(json.dumps(app.openapi(), indent=2))" > ../frontend/openapi.json
          cd ../frontend
          npm run codegen

      - name: Fail on a stale committed client
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  resume-schema-lock:
    name: resume schema lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Golden snapshot + append-only sha256 hash lock for the resume document
      # shape. Any shape change fails here unless schema_version is bumped, an
      # upcaster step is registered, and a new golden is committed; a released
      # golden or its recorded hash can never change silently. Also asserts every
      # historical golden still upcasts to the current shape with real field values
      # intact, and that canonical serialization is byte-stable. Runs in the normal
      # backend suite too; this named job makes it an explicit release gate.
      - name: Resume schema golden + hash-lock guard
        run: uv run pytest tests/test_resume_golden.py tests/test_resume_golden_guard.py --no-cov
