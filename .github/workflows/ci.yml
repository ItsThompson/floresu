name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, worker, mcp]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy --strict)
        run: uv run mypy --strict

      - name: Test (pytest)
        run: uv run pytest

  contract:
    name: contract (schema mirror + header constants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Editable-installs the backend and MCP packages so both import in one
      # interpreter: the only place the two re-declared wire contracts meet.
      - name: Install dependencies (editable backend + mcp)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy --strict)
        run: uv run mypy --strict

      # Schema-mirror + header-constant drift guards: fail on any undeclared
      # mcp<->backend wire divergence (release gate).
      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Test (vitest, coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  codegen-drift:
    name: codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Regenerate the OpenAPI document from the live FastAPI app and the TS
      # client from it, then fail if the committed client is stale. Mirrors
      # `just codegen`.
      - name: Regenerate the typed client
        run: |
          cd backend
          LOG_LEVEL=critical uv run python -c "import json; from floresu.api.main import app; print(json.dumps(app.openapi(), indent=2))" > ../frontend/openapi.json
          cd ../frontend
          npm run codegen

      - name: Fail on a stale committed client
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  resume-schema-lock:
    name: resume schema lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Golden snapshot + append-only sha256 hash lock for the resume document
      # shape. Any shape change fails here unless schema_version is bumped, an
      # upcaster step is registered, and a new golden is committed; a released
      # golden or its recorded hash can never change silently. Also asserts every
      # historical golden still upcasts to the current shape with real field values
      # intact, and that canonical serialization is byte-stable. Runs in the normal
      # backend suite too; this named job makes it an explicit release gate.
      - name: Resume schema golden + hash-lock guard
        run: uv run pytest tests/test_resume_golden.py tests/test_resume_golden_guard.py --no-cov

  # ---------------------------------------------------------------------------
  # deploy-config: validate the deployment topology WITHOUT a live VPS. Runs the
  # deploy.sh bash test harness, shellchecks the deploy script, parses every
  # Compose layer with the official parser, and validates the Prometheus rules +
  # Alertmanager config with promtool/amtool. Self-contained (no app deps).
  # ---------------------------------------------------------------------------
  deploy-config:
    name: deploy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy script tests (deploy_test.sh)
        run: bash scripts/tests/deploy_test.sh

      - name: Shellcheck the deploy script
        run: shellcheck scripts/deploy.sh

      # Compose configs are environment-sourced (never bind-mounted); populate
      # them from the committed files, exactly as the justfile and deploy do.
      - name: Validate Compose topology (base + dev + full deploy overlay)
        run: |
          set -euo pipefail
          export FLORESU_PROMETHEUS_CONFIG="$(cat deployments/prometheus/prometheus.yml)"
          export FLORESU_PROMETHEUS_ALERTS="$(cat deployments/prometheus/alerts.yml)"
          # Base file (the deployable artifact) and the local-dev overlay.
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          # Full deploy shape: tunnel + deploy overlays under the tunnels profile.
          # The overlays require app secrets/configs; dummy values prove the file
          # parses (never used at rest).
          export FLORESU_OAUTH_PRIVATE_KEY=dummy FLORESU_CLOUDFLARED_CREDENTIALS=dummy
          export FLORESU_ALERTMANAGER_CONFIG=dummy FLORESU_CLOUDFLARED_INGRESS=dummy
          export POSTGRES_PASSWORD=dummy SESSION_JWT_SECRET=dummy INTERNAL_API_TOKEN=dummy
          export GF_SECURITY_ADMIN_PASSWORD=dummy REDIS_PASSWORD=dummy
          export R2_ACCESS_KEY_ID=dummy R2_SECRET_ACCESS_KEY=dummy
          docker compose \
            -f docker-compose.yml -f docker-compose.tunnel.yml -f docker-compose.deploy.yml \
            --profile tunnels config -q

      - name: Validate Prometheus config + alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/deployments/prometheus:/cfg:ro" --entrypoint promtool \
            prom/prometheus:v3.1.0 check config /cfg/prometheus.yml
          docker run --rm -v "$PWD/deployments/prometheus:/cfg:ro" --entrypoint promtool \
            prom/prometheus:v3.1.0 check rules /cfg/alerts.yml

      - name: Validate Alertmanager config (amtool)
        run: |
          # Render the ${DISCORD_WEBHOOK_URL} placeholder to a dummy valid URL so
          # amtool accepts it (Alertmanager rejects a non-URL webhook).
          DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/0/dummy \
            envsubst '$DISCORD_WEBHOOK_URL' < deployments/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
          docker run --rm -v /tmp/alertmanager.yml:/am.yml:ro --entrypoint amtool \
            prom/alertmanager:v0.27.0 check-config /am.yml

  # ---------------------------------------------------------------------------
  # e2e: the Playwright full-stack suite, split across parallel shards. Each
  # shard runs on its own runner VM with its own stack: it brings up the E2E
  # infrastructure (Postgres, Redis, MinIO) from e2e/docker-compose.e2e.yml, then
  # Playwright starts the app processes (both ASGI apps, the frontend production
  # build, and the fake embedding provider) and drives its slice of the suite
  # (auth, feed, search, settings, the agent boundary, and the anchor flows)
  # through a real browser. No run calls OpenAI or real R2 (embedding is a local
  # fake; the object store is MinIO). Fixed host ports never collide because
  # shards run on separate VMs. Each shard emits a blob report; the e2e-report
  # job below merges them into one HTML report.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (playwright full-stack)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # poppler-utils supplies `pdftotext`, used to assert the exported PDF has
      # selectable text.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install backend deps (migrations + object-store bucket)
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Brings up the compose infrastructure, migrates, creates the bucket, then
      # runs this shard's specs (Playwright starts the app servers). CI is set by
      # GitHub Actions, so servers are launched fresh (no reuse) and the run
      # retries once. `--shard` partitions which whole spec files this runner
      # executes; `npm test` forwards it to `playwright test`.
      - name: Run the shard
        working-directory: e2e
        run: npm test -- --shard=${{ matrix.shard }}/4

      # Upload even on failure so a red shard still contributes its results to the
      # merged report.
      - name: Upload the shard blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # e2e-report: merge the per-shard blob reports into a single HTML report.
  # `if: always()` so the report is produced even when a shard fails, and it
  # merges whatever blobs landed (a shard that failed before emitting a blob is
  # simply absent). Only needs Node + the e2e deps for the `merge-reports` CLI;
  # no browser install and no infrastructure.
  # ---------------------------------------------------------------------------
  e2e-report:
    name: e2e report (merge)
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      # merge-multiple flattens every blob-* artifact into one directory; each
      # shard's blob file is named per-shard, so they do not collide.
      - name: Download all shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blobs
          merge-multiple: true

      - name: Merge blob reports into one HTML report
        working-directory: e2e
        run: npx playwright merge-reports --reporter=html ../all-blobs

      - name: Upload the merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

