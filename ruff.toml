# Shared ruff configuration for every Python package in the monorepo.
# Each package extends this file from its own pyproject.toml.

target-version = "py312"
line-length = 100
src = ["src", "tests"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]

[lint.isort]
known-first-party = ["floresu", "floresu_worker", "floresu_mcp"]

[lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls Depends()/Query()/... in argument
# defaults by design; these are immutable markers, not mutable-default bugs (B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
]

[format]
docstring-code-format = true
